<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style type="text/css">
        ul{
            list-style-type:none;
            margin: 0px;
            padding:0px;
            overflow:hidden;
            background-color: bisque;
        }
        li{
            float:left;
        }
        li a, .dropbtn {
            display:inline-block;
            padding:14px 16px;
            color:black;
            text-decoration: none;
            text-align:center;
        }
        li a:hover, .dropbtn:hover .dropbtn{
            background-color:orange;
        }
        .dropdown{
            display: inline-block;
        }
        .content{
            display: none;
            position: absolute;
            background-color: aqua;
            min-width: 160px;
            box-shadow: 8px 16px lightgray;
            z-index: 1;
        }
        .content a{
            color: black;
            padding: 12px 16px;
            display: block;
            text-decoration: none;
            text-align: left;

        }
        .content a:hover{
            background-color: bisque;
        }
        .dropdown:hover .content{
            display: block;
        }
    </style>
</head>
<body>
    <ul>
        <li><a href="#Home">Home</a></li>
        <li><a  href="#News">News</a></li>
        <li class="dropdown"><a  href="javascript:void(0)" class="dropbtn">products</a>
            <div class="content">
                <a href="#Men">Men</a>
                <a href="#Women">Women</a>
                <a href="#Kids">Kids</a>
            </div>
        </li>
    </ul>
</body>
</html>
