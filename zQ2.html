<!DOCTYPE html>
<html lang="en">
<head>
    <style type="text/css">
        input[type=text],select{
            display: block;
            border: 1px solid #3d34f1;
            margin: 8px 25%;
            padding: 12px 20px;
            width: 50%;
            box-sizing: border-box;
            border-radius:5px;
        }
        input[type=password],select{
            display: block;
            border: 1px solid #1919b0;
            margin: 8px 25%;
            padding: 12px 20px;
            width: 50%;
            box-sizing: border-box;
            border-radius:5px;
        }
        input[type=submit]{
            width: 20%;
            margin: 8px 20%;
            padding: 12px 20px;
            cursor: pointer;
            border: 2px solid #000000;
            border-radius: 5px;
            background-color: rgb(10, 237, 94);

        input[type=submit]:hover{
            background-color: rgb(81, 81, 79);
        }
        div{

            border-radius: 20px;
            text-align: center;
            padding: 20px;
            margin: 20px 25%;
        }
    </style>
