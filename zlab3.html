<!DOCTYPE html>
<html lang="en">
<head>

    <style type="text/css">
      p  {
            font-size:50px;
            color:blue;
            font-family: arial;
        }
        .title{
            font-size:50px;
            color:red;
            font-family:times;

        }
         ul{
            list-style-type:none;
            margin: 0px;
            padding:0px;
            overflow:hidden;
        }
        li{
            float:left;
        }
        li a {
            display:block;
            padding:14px 16px;
            background-color:red;
            color:black;
            text-decoration: none;
            text-align:center;
        }
        li a:hover:not(.Active){
            color:yellow;
            background-color:orange;
        }
        .Active{
            color:pink;
            background-color:purple;
        }
    </style>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
       <ul>
        <li><a href="#Home" class="Active">Home</a></li>
        <li><a  href="#product">product</a></li>
        <li><a  href="#about us">about us</a></li>
        </ul>
    </div>
    <p  class="title">hello</p>
     <p>hello</p>
      <p>hello</p>
       <p>hello</p>
        <p>hello</p>
</body>
</html>
