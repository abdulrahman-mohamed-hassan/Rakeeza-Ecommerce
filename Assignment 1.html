<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration Form</title>
</head>
<body>

    <form action="/submit-data" method="post">
        
        <h2>Registration Form</h2>

        <label for="first_name">First Name:</label><br>
        <input type="text" id="first_name" name="first_name" required><br><br>

        <label for="last_name">Last Name:</label><br>
        <input type="text" id="last_name" name="last_name" required><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>

        <label>Gender:</label><br>
        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">Male</label><br>
        
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label><br><br>

        <input type="checkbox" id="newsletter" name="newsletter" value="subscribe">
        <label for="newsletter">Sign up for the newsletter</label><br><br>

        <label for="country">Select Country:</label><br>
        <select id="country" name="country" required>
            <option value="" disabled selected>-- Choose a Country --</option>
            <option value="usa">USA</option>
            <option value="can">Canada</option>
            <option value="uk">United Kingdom</option>
            <option value="other">Other</option>
        </select><br><br>

        <label for="comments">Comments/Feedback:</label><br>
        <textarea id="comments" name="comments" rows="4" cols="50" placeholder="Type your comments here..."></textarea><br><br>

        <input type="submit" value="Submit Form">

    </form>

</body>
</html>
